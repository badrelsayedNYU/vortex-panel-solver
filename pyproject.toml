[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "panel"
version = "0.1.0"
description = "Linear-strength vortex panel method for 2D airfoils, with compressibility corrections"
authors = [{ name = "Badr Elsayed" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8", "pandas>=2.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]
app = ["streamlit>=1.30"]

[project.scripts]
airfoil-analyze = "panel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
